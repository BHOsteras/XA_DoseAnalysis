[project]
name = "xa-dose-analysis"
version = "0.2.0"
description = "Analysis of radiation dose data from interventional procedures (DoseTrack + IDS7)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "seaborn>=0.13.2",
    "openpyxl>=3.0.0",
    "python-calamine>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = [
    # Archived pre-refactor notebooks, kept as a historical record:
    "notebooks/archive",
    # Hand-maintained mapping dictionaries: the long criteria strings are
    # data, not code worth reformatting:
    "src/xa_dose_analysis/mapping_dicts",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
    "B",  # bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
