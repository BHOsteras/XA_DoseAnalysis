# Configuration for XA_DoseAnalysis.
#
# Everything that used to be hardcoded in the notebooks lives here:
# data locations per machine, room-name standardization and the analyses
# (room lists, mapping dictionary, procedures with plot limits and DRLs).

[paths]
figures = "Figures"   # output folder for plots, relative to this file
reports = "Reports"   # output folder for Excel/text reports, relative to this file

# Data root per machine. The key is the hostname (socket.gethostname());
# "default" is used when the hostname is not listed.
# Windows paths must use single quotes (TOML literal strings) so backslashes work.
[paths.data_root]
default = "/run/media/bhosteras/PRIVATE_USB/Intervensjon Doser"
"BHs-Desktop" = 'E:\Intervensjon Doser'
"BH-XPS" = 'G:\Intervensjon Doser'

[data]
ids7_subfolder = "IDS7"                            # <data_root>/IDS7/<year>/
dosetrack_subfolder = "DoseTrack - Serienivå"      # procedure-level exports
exposure_subfolder = "DoseTrack - Eksponeringsnivå"  # exposure-level exports
# Procedure-level analyses use the dosetrack_subfolder when it exists and
# otherwise fall back to the exposure_subfolder (either works; the
# exposure-level files are just bigger).

# Room-name standardization: standard name = list of variants seen in the data.
# Applied to both the IDS7 'Rom/modalitet (RIS)' and the DoseTrack 'Room' column.
[room_aliases]
KRH_XA3 = ["KRH_XA3_Coroventis", "KRH_XA3_IVUS", "KRH_XA3_OCT"]
KRH_XA7 = ["KRH_XA7_Intrasight", "KRH_XA7_Coroventis", "KRH_XA7_IVUS", "KRH_XA7_OCT"]
KRH_XA8 = ["KRH_XA8_Coroventis", "KRH_XA8_IVUS", "KRH_XA8_OCT"]
KUL_XA1 = ["KUL_XA1_Coroventis", "KUL_XA1_IVUS", "KUL_XA1_OCT", "KUL_XA1_MacLab"]
KUL_XA2 = ["KUL_XA2_IVUS", "KUL_XA2_OCT", "KUL_XA2_MacLab"]
KUL_XA4 = ["KUL_XA4_IVUS", "KUL_XA4_OCT", "KUL_XA4_MacLab"]

# ----------------------------------------------------------------------------
# Analyses. Each [analyses.<name>] block defines:
#   rooms      - rooms to include (omit for no room filter)
#   mapping    - mapping dictionary name (see mapping.MAPPING_REGISTRY)
#   max_age    - optional: keep only patients younger than this (years)
#   procedures - procedures to plot/report:
#       name    = mapped procedure name
#       y_max   = y-axis limit for the boxplot (DAP, Gy*cm2)
#       drl_dap = optional diagnostic reference level for DAP (Gy*cm2)
#       drl_cak = optional diagnostic reference level for CAK (mGy)
# ----------------------------------------------------------------------------

[analyses.pci]
rooms = ["IRH_XA6", "IRH_XA7", "KRH_XA3", "KRH_XA6", "KRH_XA7", "KRH_XA8", "KUL_XA1", "KUL_XA2", "KUL_XA4"]
mapping = "pci"
procedures = [
    # Add drl_dap = <value> / drl_cak = <value> to compare against reference levels.
    { name = "Coronary angiography", y_max = 50 },
    { name = "PCI", y_max = 100 },
    { name = "TAVI", y_max = 75 },
    { name = "Mitraclip", y_max = 100 },
    { name = "PTSMA", y_max = 100 },
